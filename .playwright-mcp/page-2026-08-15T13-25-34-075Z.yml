              - heading "What Is Return on Equity?" [level=2] [ref=f2e79]
              - paragraph [ref=f2e80]: Return on Equity (ROE) measures the net income returned as a percentage of shareholders' equity. It reveals how efficiently a company uses investor capital to generate profits.
            - generic [ref=f2e81]:
              - heading "Why ROE Matters in Value Investing" [level=2] [ref=f2e82]
              - generic [ref=f2e83]:
                - paragraph [ref=f2e84]: Warren Buffett considers ROE one of the most important indicators of a quality business. A consistently high ROE (above 15%) suggests a company has a durable competitive advantage — or economic moat.
                - paragraph [ref=f2e85]: Companies that can sustain high ROE over decades demonstrate that their business model generates superior returns without requiring excessive leverage. This is a hallmark of what Buffett calls "wonderful businesses at fair prices."
